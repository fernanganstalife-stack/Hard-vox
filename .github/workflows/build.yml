
name: Compilar HARD VOX VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -B build -S . -A x64

      - name: Compilar VST3
        run: cmake --build build --config Release --target HardVox_VST3 --parallel

      - name: Comprobar plugin
        shell: pwsh
        run: |
          $plugin = "build/HardVox_artefacts/Release/VST3/HARD VOX.vst3"
          if (!(Test-Path $plugin)) {
            throw "No se encontró HARD VOX.vst3"
          }

      - name: Crear ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/HardVox_artefacts/Release/VST3/HARD VOX.vst3" -DestinationPath "HARD_VOX_VST3_Windows.zip"

      - name: Subir plugin compilado
        uses: actions/upload-artifact@v4
        with:
          name: HARD_VOX_VST3_ZIP
          path: HARD_VOX_VST3_Windows.zip
